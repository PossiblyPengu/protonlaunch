name: Build and Release Onefile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-onefile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 requests

      - name: Build onefile binary
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name protonlaunch \
            --paths . \
            --hidden-import PyQt6.sip \
            protonlaunch/protonlaunch.py
          cp dist/protonlaunch protonlaunch-linux-x86_64
          chmod +x protonlaunch-linux-x86_64

      - name: Create checksums
        run: sha256sum protonlaunch-linux-x86_64 > protonlaunch-linux-x86_64.sha256

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            protonlaunch-linux-x86_64
            protonlaunch-linux-x86_64.sha256
